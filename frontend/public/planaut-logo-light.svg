<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Squircle -->
    <linearGradient id="planaut-bg-lt" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="planaut-border-lt" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Automation Lightning Bolt Gradient -->
    <linearGradient id="planaut-bolt-lt" x1="24" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 'Aut' Text Vibrant Gradient -->
    <linearGradient id="planaut-text-aut-lt" x1="0" y1="0" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- ================= LOGOMARK (ICON) ================= -->
  <g transform="translate(0, 0)">
    <!-- Squircle Icon Box -->
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" fill="url(#planaut-bg-lt)"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="url(#planaut-border-lt)" stroke-width="1.5"/>

    <!-- Spreadsheet Matrix Cells -->
    <rect x="14" y="14" width="10" height="10" rx="3" fill="#0284C7" fill-opacity="0.15"/>
    <rect x="14" y="27" width="10" height="10" rx="3" fill="#0284C7" fill-opacity="0.25"/>
    <rect x="14" y="40" width="10" height="10" rx="3" fill="#0284C7" fill-opacity="0.35"/>
    <rect x="27" y="14" width="10" height="10" rx="3" fill="#0284C7" fill-opacity="0.15"/>

    <!-- Dynamic Automation Lightning Bolt -->
    <path d="M37 13L24 33H34L28 51L44 29H34L40 13H37Z" fill="url(#planaut-bolt-lt)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

    <circle cx="43.5" cy="18.5" r="1.75" fill="#0891B2"/>
    <circle cx="21" cy="45" r="1.25" fill="#059669"/>
  </g>

  <!-- ================= LOGOTYPE ================= -->
  <g transform="translate(80, 0)">
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#0F172A">Plan</text>
    <text x="76" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#planaut-text-aut-lt)">Aut</text>

    <!-- Subtitle -->
    <text x="1" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#64748B">AUTOMAÇÃO FISCAL INTELIGENTE</text>
  </g>
</svg>
