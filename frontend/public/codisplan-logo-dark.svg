<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:ital,wght@1,900&amp;family=Inter:wght@800;900&amp;display=swap');
      .codisplan-title-dark {
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 46px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .codisplan-sub-dark {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #94A3B8;
        letter-spacing: 5px;
      }
    </style>
  </defs>

  <!-- Texto Principal: CODISPLAN -->
  <g transform="translate(14, 48)">
    <text class="codisplan-title-dark" x="0" y="0">CODISPL<tspan fill="#FFFFFF">A</tspan>N</text>
    <!-- Detalhe em Azul Ciano no traço da letra A -->
    <rect x="207" y="-17" width="22" height="4.5" rx="2.25" fill="#00B4D8" transform="skewX(-14)" />
  </g>

  <!-- Subtítulo: CONTABILIDADE -->
  <g transform="translate(20, 74)">
    <text class="codisplan-sub-dark" x="0" y="0">CONTABILIDADE</text>
  </g>
</svg>
