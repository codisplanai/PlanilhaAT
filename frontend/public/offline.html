<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>PlanAut — Sem conexão</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; padding: 24px; }
      main { width: min(520px, 100%); padding: 32px; border: 1px solid #334155; border-radius: 20px; background: #111c2f; box-shadow: 0 20px 60px rgba(2, 6, 23, .35); }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 1.6rem; }
      p { margin: 0; color: #94a3b8; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; color: #082f49; background: #67e8f9; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192x192.svg" alt="PlanAut" />
      <h1>Você está sem conexão</h1>
      <p>O PlanAut precisa de internet para acessar dados fiscais e autenticação. Assim que a conexão voltar, tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
