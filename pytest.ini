[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
filterwarnings =
    # FastAPI 0.99/Starlette 0.27 ainda usa estes atalhos internamente. Eles
    # não são warnings do código da aplicação e ficam cobertos pela suíte.
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx\._client
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning:starlette\.formparsers
