name: Main - Semantic Release and Production Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  version:
    name: Resolve semantic version
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      major: ${{ steps.semver.outputs.major }}
      minor: ${{ steps.semver.outputs.minor }}
      bump: ${{ steps.semver.outputs.bump }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Calculate next version from PR title
        id: semver
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$PR_TITLE" =~ ^release\((patch|minor|major)\):\ .+ ]]; then
            echo "::error::Título esperado: release(patch|minor|major): descrição"
            exit 1
          fi
          BUMP="${BASH_REMATCH[1]}"

          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -z "$LATEST_TAG" ]]; then
            VERSION="1.0.0"
            BUMP="initial"
          else
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Release calculada: v$VERSION ($BUMP)"

  base-images:
    name: Publish/refresh owned GHCR dependencies
    needs: version
    uses: ./.github/workflows/container-bases.yml

  tests:
    name: Full release validation
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          ENABLE_LOCAL_AUTH: "true"
          AUTO_CREATE_SCHEMA: "true"
          SEED_DEFAULTS: "false"
          DATABASE_URL: sqlite:///./ci_test.db
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false
          npx tsc --noEmit -p tsconfig.node.json --pretty false

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: PWA assets validation
        run: |
          node --check frontend/public/sw.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/public/manifest.webmanifest','utf8'))"

  publish:
    name: Build release image and publish GHCR
    needs: [version, base-images, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      deploy_ref: ${{ steps.output.outputs.deploy_ref }}
      image_name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image names
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          echo "name=${REGISTRY}/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "node_base=${REGISTRY}/${OWNER}/planilhaat-base-node:22-alpine" >> "$GITHUB_OUTPUT"
          echo "python_base=${REGISTRY}/${OWNER}/planilhaat-base-python:3.12-slim" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=raw,value=${{ needs.version.outputs.major }}
            type=raw,value=release-sha-${{ github.event.pull_request.merge_commit_sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}

      - name: Build and push release image from owned GHCR bases
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            NODE_BASE_IMAGE=${{ steps.image.outputs.node_base }}
            PYTHON_BASE_IMAGE=${{ steps.image.outputs.python_base }}
          provenance: mode=max
          sbom: true

      - name: Select immutable deploy reference
        id: output
        shell: bash
        run: echo "deploy_ref=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  public-images:
    name: Require anonymous/public GHCR pulls
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify application and dependency packages are Public
        shell: bash
        env:
          APP_IMAGE: ${{ needs.publish.outputs.deploy_ref }}
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          images=(
            "$APP_IMAGE"
            "ghcr.io/${OWNER}/planilhaat-base-node:22-alpine"
            "ghcr.io/${OWNER}/planilhaat-base-python:3.12-slim"
            "ghcr.io/${OWNER}/planilhaat-postgres:16-alpine"
          )

          docker logout ghcr.io >/dev/null 2>&1 || true

          failed=0
          for image in "${images[@]}"; do
            echo "Anonymous pull check: $image"
            if ! docker pull "$image"; then
              echo "::error::GHCR package is not publicly pullable: $image"
              failed=1
            fi
          done

          if (( failed != 0 )); then
            echo "::error::After the first package publication, set every PlanilhaAT container package to Public in GitHub Packages, then re-run failed jobs. GHCR packages are private on first publication by default."
            exit 1
          fi

  deploy:
    name: Deploy production by immutable image digest
    needs: [version, publish, public-images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: |
            compose.yaml
            .env.example
            deploy
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planilhaat}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET/deploy'"
          scp -P "$PORT" compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/compose.yaml"
          scp -P "$PORT" .env.example "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/.env.example"
          scp -P "$PORT" deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/deploy/deploy.sh"

      - name: Deploy immutable release image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.deploy_ref }}
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planilhaat}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$TARGET/deploy/deploy.sh' && APP_DIR='$TARGET' '$TARGET/deploy/deploy.sh' '$IMAGE'"

  release:
    name: Tag and create GitHub Release with deployment assets
    needs: [version, publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Build release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          BUMP: ${{ needs.version.outputs.bump }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          APP_IMAGE: ${{ needs.publish.outputs.image_name }}
          APP_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : > release-notes.md

          if [[ "$VERSION" == "1.0.0" && -f docs/releases/1.0.0.md ]]; then
            cat docs/releases/1.0.0.md >> release-notes.md
            printf '\n---\n\n' >> release-notes.md
          fi

          cat >> release-notes.md <<NOTES
          ## Release metadata

          - Version: \`$VERSION\`
          - SemVer change: \`$BUMP\`
          - Application image: \`$APP_IMAGE:$VERSION\`
          - Immutable digest: \`$APP_IMAGE@$APP_DIGEST\`
          - Node base: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planilhaat-base-node:22-alpine\`
          - Python base: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planilhaat-base-python:3.12-slim\`
          - PostgreSQL image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planilhaat-postgres:16-alpine\`
          - Production deployment: completed before this release was created.

          ## Release PR

          **$PR_TITLE**

          NOTES
          printf '%s\n' "$PR_BODY" >> release-notes.md

      - name: Create semantic tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::A tag $TAG já existe."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "PlanilhaAT $TAG" \
            --notes-file release-notes.md \
            compose.yaml \
            .env.example
