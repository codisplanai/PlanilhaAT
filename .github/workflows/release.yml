name: Main - Candidate, Production Deploy and Semantic Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for an already released project
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  version:
    name: Resolve release candidate version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'develop' &&
        startsWith(github.event.pull_request.title, 'release(')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      major: ${{ steps.semver.outputs.major }}
      minor: ${{ steps.semver.outputs.minor }}
      patch: ${{ steps.semver.outputs.patch }}
      bump: ${{ steps.semver.outputs.bump }}
      target_sha: ${{ steps.semver.outputs.target_sha }}
      candidate_tag: ${{ steps.semver.outputs.candidate_tag }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Calculate candidate version
        id: semver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BUMP="${MANUAL_BUMP:-patch}"
          else
            if [[ ! "$PR_TITLE" =~ ^release\((patch|minor|major)\):\ .+ ]]; then
              echo "::error::Expected release PR title: release(patch|minor|major): description"
              exit 1
            fi
            BUMP="${BASH_REMATCH[1]}"
          fi

          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -z "$LATEST_TAG" ]]; then
            VERSION="1.0.0"
            BUMP="initial"
          else
            CURRENT="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) echo "::error::Unsupported bump: $BUMP"; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          TARGET_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TAG="release-candidate-${VERSION}-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

          echo "Candidate only: $CANDIDATE_TAG"
          echo "No stable GHCR tag or GitHub Release is created before a healthy production deployment."

  tests:
    name: Full release candidate validation
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.target_sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          ENABLE_LOCAL_AUTH: "true"
          AUTO_CREATE_SCHEMA: "true"
          SEED_DEFAULTS: "false"
          DATABASE_URL: sqlite:///./ci_test.db
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false
          npx tsc --noEmit -p tsconfig.node.json --pretty false

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: PWA assets validation
        run: |
          node --check frontend/public/sw.js
          node --check frontend/public/runtime-config.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/public/manifest.webmanifest','utf8'))"

  runtime-preflight:
    name: Detect configured production runtime
    needs: [version, tests]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check production target without creating a release
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HEALTH_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Production runtime not provisioned"
              echo
              echo "No release image, stable alias, Git tag, or GitHub Release will be created."
              echo "Missing GitHub Environment values: \`${missing[*]}\`."
              echo
              echo "The next run can bootstrap the first release after the runtime is configured."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  not-ready:
    name: Production release pending infrastructure bootstrap
    needs: [version, tests, runtime-preflight]
    if: needs.runtime-preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep repository in unreleased state
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          echo "::warning::Production is not provisioned. v$VERSION remains a candidate only; no release was published."
          {
            echo "### Release not published"
            echo
            echo "Target version: \`v$VERSION\`"
            echo
            echo "Status: **waiting for production runtime bootstrap**"
          } >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: Build production release candidate
    needs: [version, tests, runtime-preflight]
    if: needs.runtime-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      deploy_ref: ${{ steps.output.outputs.deploy_ref }}
      image_name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.target_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image names
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          echo "name=${REGISTRY}/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "node_base=${REGISTRY}/${OWNER}/planilhaat-base-node:22-alpine" >> "$GITHUB_OUTPUT"
          echo "python_base=${REGISTRY}/${OWNER}/planilhaat-base-python:3.12-slim" >> "$GITHUB_OUTPUT"

      - name: Candidate metadata only
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}-rc.${{ github.run_number }}.${{ github.run_attempt }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.target_sha }}

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}-rc.${{ github.run_number }}.${{ github.run_attempt }}
            NODE_BASE_IMAGE=${{ steps.image.outputs.node_base }}
            PYTHON_BASE_IMAGE=${{ steps.image.outputs.python_base }}
          provenance: false
          sbom: false

      - name: Select candidate deployment reference
        id: output
        shell: bash
        run: echo "deploy_ref=${{ steps.image.outputs.name }}:${{ needs.version.outputs.candidate_tag }}" >> "$GITHUB_OUTPUT"

      - name: Attest candidate provenance in GitHub
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Remove untagged and legacy hash-only versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          bash deploy/cleanup-ghcr.sh "${REPO,,}"

  public-candidate:
    name: Verify release candidate image is public
    needs: [version, candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Anonymous candidate pull
        env:
          IMAGE: ${{ needs.candidate.outputs.deploy_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE"

  deploy:
    name: Deploy candidate to production
    needs: [version, candidate, public-candidate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout production deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.target_sha }}
          sparse-checkout: |
            deploy/cloudpanel
            deploy/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planaut-production}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET/deploy'"
          scp -P "$PORT" deploy/cloudpanel/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/compose.yaml"
          scp -P "$PORT" deploy/cloudpanel/.env.example "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/.env.example"
          scp -P "$PORT" deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/deploy/deploy.sh"

      - name: Deploy exact candidate image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.candidate.outputs.deploy_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planaut-production}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$TARGET/deploy/deploy.sh' && APP_DIR='$TARGET' '$TARGET/deploy/deploy.sh' '$IMAGE'"

      - name: Require public production health before release
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..36}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "Production application is publicly healthy at $HEALTH_URL"
              exit 0
            fi
            echo "Public production healthcheck not ready ($attempt/36)"
            sleep 5
          done
          echo "::error::Production application did not become publicly healthy: $HEALTH_URL"
          exit 1

  promote:
    name: Promote deployed candidate to stable GHCR tags
    needs: [version, candidate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release_ref: ${{ steps.refs.outputs.release_ref }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the deployed image without rebuilding
        id: refs
        env:
          CANDIDATE: ${{ needs.candidate.outputs.deploy_ref }}
          APP_IMAGE: ${{ needs.candidate.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MINOR: ${{ needs.version.outputs.minor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$CANDIDATE"

          tags=(
            "production"
            "latest"
            "$VERSION"
            "${MAJOR}.${MINOR}"
            "$MAJOR"
          )

          for tag in "${tags[@]}"; do
            target="${APP_IMAGE}:${tag}"
            echo "Promoting $CANDIDATE -> $target"
            docker tag "$CANDIDATE" "$target"
            docker push "$target"
          done

          echo "release_ref=${APP_IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify all stable aliases by anonymous pull
        env:
          APP_IMAGE: ${{ needs.candidate.outputs.image_name }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
          MINOR: ${{ needs.version.outputs.minor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true

          tags=("production" "latest" "$VERSION" "${MAJOR}.${MINOR}" "$MAJOR")
          for tag in "${tags[@]}"; do
            image="${APP_IMAGE}:${tag}"
            docker image rm "$image" >/dev/null 2>&1 || true
            echo "Anonymous pull check: $image"
            docker pull "$image"
          done

  release:
    name: Create first-class Git tag and GitHub Release
    needs: [version, candidate, deploy, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.target_sha }}
          fetch-depth: 0

      - name: Create idempotent semantic tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ needs.version.outputs.target_sha }}
          APP_IMAGE: ${{ needs.candidate.outputs.image_name }}
          APP_DIGEST: ${{ needs.candidate.outputs.digest }}
          RELEASE_REF: ${{ needs.promote.outputs.release_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING_SHA" != "$TARGET_SHA" ]]; then
              echo "::error::$TAG already points to $EXISTING_SHA instead of $TARGET_SHA"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

          cat > release-notes.md <<NOTES
          ## PlanAut $VERSION

          This release was created only after the production container passed its public health check.

          - Production channel: \`$APP_IMAGE:production\`
          - Latest channel: \`$APP_IMAGE:latest\`
          - Exact release image: \`$RELEASE_REF\`
          - Build digest (audit): \`$APP_DIGEST\`
          - Production deployment: healthy before release publication.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; keeping it."
          else
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "PlanAut $TAG" \
              --notes-file release-notes.md
          fi
