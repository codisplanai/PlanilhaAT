name: Develop - Test, GHCR and Runtime Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: develop-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  tests:
    name: Full tests before development image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          ENABLE_LOCAL_AUTH: "true"
          AUTO_CREATE_SCHEMA: "true"
          SEED_DEFAULTS: "false"
          DATABASE_URL: sqlite:///./ci_test.db
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false
          npx tsc --noEmit -p tsconfig.node.json --pretty false

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: PWA assets validation
        run: |
          node --check frontend/public/sw.js
          node --check frontend/public/runtime-config.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/public/manifest.webmanifest','utf8'))"

  publish:
    name: Publish develop build image to GHCR
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      deploy_ref: ${{ steps.output.outputs.deploy_ref }}
      image_name: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.app_version }}
      dev_tag: ${{ steps.version.outputs.dev_tag }}

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve development prerelease version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          STABLE_VERSION="${LATEST_TAG#v}"
          if [[ -z "$STABLE_VERSION" ]]; then
            STABLE_VERSION="1.0.0"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$STABLE_VERSION"
          APP_VERSION="${STABLE_VERSION}-develop.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          DEV_TAG="develop-${STABLE_VERSION}-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "stable=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image names
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          echo "name=${REGISTRY}/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "node_base=${REGISTRY}/${OWNER}/planilhaat-base-node:22-alpine" >> "$GITHUB_OUTPUT"
          echo "python_base=${REGISTRY}/${OWNER}/planilhaat-base-python:3.12-slim" >> "$GITHUB_OUTPUT"

      - name: Docker metadata with development tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=develop
            type=raw,value=develop-${{ steps.version.outputs.stable }}
            type=raw,value=develop-${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=develop-${{ steps.version.outputs.major }}
            type=raw,value=${{ steps.version.outputs.dev_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push development image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            NODE_BASE_IMAGE=${{ steps.image.outputs.node_base }}
            PYTHON_BASE_IMAGE=${{ steps.image.outputs.python_base }}
          provenance: false
          sbom: false

      - name: Select readable immutable development reference
        id: output
        shell: bash
        run: echo "deploy_ref=${{ steps.image.outputs.name }}:${{ steps.version.outputs.dev_tag }}" >> "$GITHUB_OUTPUT"

      - name: Attest provenance in GitHub
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: Remove untagged and legacy hash-only application versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          bash deploy/cleanup-ghcr.sh "${REPO,,}"

  public-image:
    name: Verify develop image is public
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Anonymous pull of immutable develop image
        env:
          IMAGE: ${{ needs.publish.outputs.deploy_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE"

  runtime-preflight:
    name: Detect configured development runtime
    needs: [publish, public-image]
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment target without failing build publication
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HEALTH_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Development runtime not provisioned"
              echo
              echo "The container image was built and published, but no application deployment was attempted."
              echo "Missing GitHub Environment values: \`${missing[*]}\`."
              echo
              echo "This is an infrastructure bootstrap state, not a build failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  deploy-development:
    name: Deploy development application
    needs: [publish, runtime-preflight]
    if: needs.runtime-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            deploy/cloudpanel
            deploy/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload development manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planaut-development}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$TARGET/deploy'"
          scp -P "$PORT" deploy/cloudpanel/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/compose.yaml"
          scp -P "$PORT" deploy/cloudpanel/.env.example "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/.env.example"
          scp -P "$PORT" deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/deploy/deploy.sh"

      - name: Deploy immutable development build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.deploy_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_PATH:-/opt/planaut-development}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x '$TARGET/deploy/deploy.sh' && APP_DIR='$TARGET' '$TARGET/deploy/deploy.sh' '$IMAGE'"

      - name: Verify public development application health
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "Development application is publicly healthy at $HEALTH_URL"
              exit 0
            fi
            echo "Public healthcheck not ready ($attempt/24)"
            sleep 5
          done
          echo "::error::Development deployment did not become publicly healthy: $HEALTH_URL"
          exit 1

  deployment-state:
    name: Development publication state
    needs: [publish, runtime-preflight, deploy-development]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report real deployment state
        env:
          CONFIGURED: ${{ needs.runtime-preflight.outputs.configured }}
          DEPLOY_RESULT: ${{ needs.deploy-development.result }}
          IMAGE: ${{ needs.publish.outputs.deploy_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$CONFIGURED" != "true" ]]; then
            echo "::warning::Development image exists, but the application is NOT deployed because the runtime is not provisioned."
            exit 0
          fi

          if [[ "$DEPLOY_RESULT" != "success" ]]; then
            echo "::error::Development runtime is configured, but application deployment failed."
            exit 1
          fi

          echo "Development application deployment completed from $IMAGE"
