name: Develop - Test and GHCR Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: develop-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Full tests before development image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          ENABLE_LOCAL_AUTH: "true"
          AUTO_CREATE_SCHEMA: "true"
          SEED_DEFAULTS: "false"
          DATABASE_URL: sqlite:///./ci_test.db
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false
          npx tsc --noEmit -p tsconfig.node.json --pretty false

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: PWA assets validation
        run: |
          node --check frontend/public/sw.js
          node --check frontend/public/runtime-config.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/public/manifest.webmanifest','utf8'))"

  publish:
    name: Publish develop image to GHCR
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve development version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          STABLE_VERSION="${LATEST_TAG#v}"
          if [[ -z "$STABLE_VERSION" ]]; then
            STABLE_VERSION="1.0.0"
          fi
          SHORT_SHA="${GITHUB_SHA:0:12}"
          APP_VERSION="${STABLE_VERSION}-develop.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          DEV_TAG="develop-${STABLE_VERSION}-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "stable=$STABLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image names
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          REPO="${REPO,,}"
          echo "name=${REGISTRY}/${OWNER}/${REPO}" >> "$GITHUB_OUTPUT"
          echo "node_base=${REGISTRY}/${OWNER}/planilhaat-base-node:22-alpine" >> "$GITHUB_OUTPUT"
          echo "python_base=${REGISTRY}/${OWNER}/planilhaat-base-python:3.12-slim" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=develop
            type=raw,value=develop-${{ steps.version.outputs.stable }}
            type=raw,value=${{ steps.version.outputs.dev_tag }}
            type=raw,value=dev-sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push development image from owned GHCR bases
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            NODE_BASE_IMAGE=${{ steps.image.outputs.node_base }}
            PYTHON_BASE_IMAGE=${{ steps.image.outputs.python_base }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
