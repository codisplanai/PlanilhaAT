name: Vercel - Frontend Develop and Release

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
      - "vercel.env.example"
  workflow_run:
    workflows:
      - "Main - Semantic Release and Production Deploy"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: Vercel target environment
        required: true
        type: choice
        options:
          - development
          - production
        default: development

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION || '59.19.1' }}

jobs:
  develop:
    name: Deploy develop frontend to Vercel
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'development')
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: vercel-development
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DEVELOPMENT_DOMAIN: ${{ vars.VERCEL_DEVELOPMENT_DOMAIN || 'planaut.dev.codisplan.com.br' }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Environment development is missing Vercel secret: $name"
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Resolve develop version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          STABLE_VERSION="${LATEST_TAG#v}"
          if [[ -z "$STABLE_VERSION" ]]; then
            STABLE_VERSION="1.0.0"
          fi
          APP_VERSION="${STABLE_VERSION}-develop.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel preview settings and branch variables
        run: >-
          vercel pull --yes
          --environment=preview
          --git-branch=develop
          --cwd=frontend
          --token="$VERCEL_TOKEN"

      - name: Build Vercel develop artifact
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VITE_DEPLOYMENT_CHANNEL: development
        run: vercel build --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Deploy Vercel develop artifact
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --cwd=frontend --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          vercel alias set "$DEPLOYMENT_URL" "$DEVELOPMENT_DOMAIN" --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Verify development deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "https://${DEVELOPMENT_DOMAIN}/" >/dev/null
          echo "Vercel development healthy: https://${DEVELOPMENT_DOMAIN}"

      - name: Publish develop deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          {
            echo "## Vercel development"
            echo ""
            echo "- CLI: \`vercel@$VERCEL_CLI_VERSION\`"
            echo "- Version: \`$APP_VERSION\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Stable domain: https://$DEVELOPMENT_DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy released frontend to Vercel
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN || 'planaut.codisplan.com.br' }}

    steps:
      - name: Checkout main with semantic tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Environment production is missing Vercel secret: $name"
              exit 1
            fi
          done

      - name: Checkout exact released tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$TAG" ]]; then
            echo "::error::No semantic release tag is available for production Vercel deployment."
            exit 1
          fi
          git checkout --detach "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel production settings and variables
        run: >-
          vercel pull --yes
          --environment=production
          --cwd=frontend
          --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VITE_DEPLOYMENT_CHANNEL: production
        run: vercel build --prod --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production artifact
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --cwd=frontend --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_DOMAIN" --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Verify production deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "https://${PRODUCTION_DOMAIN}/" >/dev/null
          echo "Vercel production healthy: https://${PRODUCTION_DOMAIN}"

      - name: Publish production deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Vercel production"
            echo ""
            echo "- CLI: \`vercel@$VERCEL_CLI_VERSION\`"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Version: \`$APP_VERSION\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Production domain: https://$PRODUCTION_DOMAIN"
          } >> "$GITHUB_STEP_SUMMARY"
