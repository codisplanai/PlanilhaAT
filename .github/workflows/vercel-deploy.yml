name: Vercel - Frontend Bootstrap and Release

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
      - "vercel.env.example"
  workflow_dispatch:
    inputs:
      target:
        description: Vercel target environment
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      release_sha:
        description: Exact main commit SHA for an unpublished production candidate
        required: false
        type: string
      release_version:
        description: Semantic version for an unpublished production candidate
        required: false
        type: string

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION || '59.19.1' }}
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'codisplan' }}
  VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME || 'planaut' }}

jobs:
  develop:
    name: Bootstrap/deploy develop frontend to Vercel
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'development')
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: vercel-development
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEVELOPMENT_DOMAIN: ${{ vars.VERCEL_DEVELOPMENT_DOMAIN || 'planaut.dev.codisplan.com.br' }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Detect Vercel bootstrap readiness
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in VERCEL_TOKEN VITE_API_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel development not provisioned"
              echo
              echo "No unusable frontend deployment was created."
              echo "Missing values: \`${missing[*]}\`."
              echo
              echo "A pre-existing VERCEL_PROJECT_ID is no longer required; the workflow bootstraps the project on the first configured run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        if: steps.preflight.outputs.configured == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link or create Vercel project
        if: steps.preflight.outputs.configured == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          vercel link --yes \
            --project="$VERCEL_PROJECT_NAME" \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN"
          vercel project inspect --non-interactive \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" >/dev/null

      - name: Pull Vercel development project settings
        if: steps.preflight.outputs.configured == 'true'
        run: vercel pull --yes --environment=preview --git-branch=develop --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Resolve develop version
        if: steps.preflight.outputs.configured == 'true'
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          STABLE_VERSION="${LATEST_TAG#v}"
          if [[ -z "$STABLE_VERSION" ]]; then
            STABLE_VERSION="1.0.0"
          fi
          APP_VERSION="${STABLE_VERSION}-develop.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Vercel develop artifact
        if: steps.preflight.outputs.configured == 'true'
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VITE_DEPLOYMENT_CHANNEL: development
        run: vercel build --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Deploy Vercel develop artifact
        if: steps.preflight.outputs.configured == 'true'
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --cwd=frontend --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          vercel alias set "$DEPLOYMENT_URL" "$DEVELOPMENT_DOMAIN" \
            --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Verify development frontend
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "https://${DEVELOPMENT_DOMAIN}/" >/dev/null
          echo "Vercel development healthy: https://${DEVELOPMENT_DOMAIN}"

  production:
    name: Bootstrap/deploy released frontend to Vercel
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN || 'planaut.codisplan.com.br' }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect Vercel bootstrap readiness
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in VERCEL_TOKEN VITE_API_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel production not provisioned"
              echo
              echo "The required automated Vercel production deployment cannot run."
              echo "Missing values: \`${missing[*]}\`."
              echo
              echo "A pre-existing VERCEL_PROJECT_ID is no longer required."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Vercel production configuration is incomplete."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Resolve production source
        if: steps.preflight.outputs.configured == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force

          if [[ -n "$RELEASE_SHA" || -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release_sha must be a full 40-character commit SHA."
              exit 1
            fi
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_version must use X.Y.Z SemVer."
              exit 1
            fi

            git checkout --detach "$RELEASE_SHA"
            echo "source=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
            echo "app_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::No published semantic GitHub Release is available for manual Vercel production deployment."
              exit 1
            fi

            git checkout --detach "$TAG"
            echo "source=$TAG" >> "$GITHUB_OUTPUT"
            echo "app_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Vercel CLI
        if: steps.preflight.outputs.configured == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link or create Vercel project
        if: steps.preflight.outputs.configured == 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          vercel link --yes \
            --project="$VERCEL_PROJECT_NAME" \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN"
          vercel project inspect --non-interactive \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" >/dev/null

      - name: Pull Vercel production project settings
        if: steps.preflight.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        if: steps.preflight.outputs.configured == 'true'
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
          VITE_DEPLOYMENT_CHANNEL: production
        run: vercel build --prod --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Deploy Vercel production artifact
        if: steps.preflight.outputs.configured == 'true'
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --cwd=frontend --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_DOMAIN" \
            --cwd=frontend --token="$VERCEL_TOKEN"

      - name: Verify production frontend
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "https://${PRODUCTION_DOMAIN}/" >/dev/null
          echo "Vercel production healthy: https://${PRODUCTION_DOMAIN}"
