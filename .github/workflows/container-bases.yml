name: GHCR - Base and Service Images

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"

concurrency:
  group: ghcr-base-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}:${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: planilhaat-base-node
            tag: 22-alpine
            dockerfile: containers/base-node.Dockerfile
            upstream: node:22-alpine
          - package: planilhaat-base-python
            tag: 3.12-slim
            dockerfile: containers/base-python.Dockerfile
            upstream: python:3.12-slim
          - package: planilhaat-postgres
            tag: 16-alpine
            dockerfile: containers/postgres.Dockerfile
            upstream: postgres:16-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.package }}" >> "$GITHUB_OUTPUT"

      - name: Build local GHCR wrapper image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ matrix.tag }}
          build-args: |
            UPSTREAM_IMAGE=${{ matrix.upstream }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
