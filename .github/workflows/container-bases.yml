name: GHCR - Base and Service Images

on:
  workflow_call:
    inputs:
      force:
        description: Force rebuild of all managed base images
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: Force rebuild of all managed base images
        required: false
        type: boolean
        default: false
  push:
    branches:
      - develop
      - main
    paths:
      - "containers/**"
      - ".github/workflows/container-bases.yml"
  schedule:
    # Apenas verifica se a imagem upstream mudou. Sem mudança de digest/fingerprint,
    # nenhum build/push é executado.
    - cron: "31 4 * * 1"

concurrency:
  group: ghcr-base-images
  cancel-in-progress: false

jobs:
  publish:
    name: Check/publish ${{ matrix.package }}:${{ matrix.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: planilhaat-base-node
            tag: 22-alpine
            dockerfile: containers/base-node.Dockerfile
            upstream: node:22-alpine
          - package: planilhaat-base-python
            tag: 3.12-slim
            dockerfile: containers/base-python.Dockerfile
            upstream: python:3.12-slim
          - package: planilhaat-postgres
            tag: 16-alpine
            dockerfile: containers/postgres.Dockerfile
            upstream: postgres:16-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve rebuild policy
        id: policy
        shell: bash
        env:
          FORCE_REBUILD: ${{ inputs.force == true }}
        run: |
          set -Eeuo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          LOCAL_IMAGE="ghcr.io/${OWNER}/${{ matrix.package }}:${{ matrix.tag }}"
          UPSTREAM_IMAGE="${{ matrix.upstream }}"

          # Pull da upstream é apenas uma verificação de digest; não gera imagem GHCR.
          docker pull "$UPSTREAM_IMAGE" >/dev/null
          UPSTREAM_DIGEST="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$UPSTREAM_IMAGE")"
          DOCKERFILE_SHA="$(sha256sum '${{ matrix.dockerfile }}' | awk '{print $1}')"
          FINGERPRINT="$(printf '%s\n%s\n%s\n%s\n' \
            '${{ matrix.package }}' \
            '${{ matrix.tag }}' \
            "$UPSTREAM_DIGEST" \
            "$DOCKERFILE_SHA" | sha256sum | awk '{print $1}')"

          CURRENT_FINGERPRINT=""
          if docker pull "$LOCAL_IMAGE" >/dev/null 2>&1; then
            CURRENT_FINGERPRINT="$(docker image inspect \
              --format '{{ index .Config.Labels "io.codisplan.planaut.base.fingerprint" }}' \
              "$LOCAL_IMAGE" 2>/dev/null || true)"
          fi

          REBUILD=false
          REASON="unchanged"
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            REBUILD=true
            REASON="forced"
          elif [[ -z "$CURRENT_FINGERPRINT" || "$CURRENT_FINGERPRINT" == "<no value>" ]]; then
            REBUILD=true
            REASON="missing-or-unmanaged-image"
          elif [[ "$CURRENT_FINGERPRINT" != "$FINGERPRINT" ]]; then
            REBUILD=true
            REASON="upstream-or-definition-changed"
          fi

          echo "image=ghcr.io/${OWNER}/${{ matrix.package }}" >> "$GITHUB_OUTPUT"
          echo "local_image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "upstream_digest=$UPSTREAM_DIGEST" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "rebuild=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          echo "Image: $LOCAL_IMAGE"
          echo "Upstream: $UPSTREAM_DIGEST"
          echo "Policy: $REASON"

      - name: Skip unchanged image
        if: steps.policy.outputs.rebuild != 'true'
        run: echo "Base image unchanged; build/push skipped."

      - name: Set up Docker Buildx
        if: steps.policy.outputs.rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build changed base image
        if: steps.policy.outputs.rebuild == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.policy.outputs.local_image }}
          build-args: |
            UPSTREAM_IMAGE=${{ matrix.upstream }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.codisplan.planaut.base.upstream=${{ matrix.upstream }}
            io.codisplan.planaut.base.upstream.digest=${{ steps.policy.outputs.upstream_digest }}
            io.codisplan.planaut.base.fingerprint=${{ steps.policy.outputs.fingerprint }}
          provenance: mode=max
          sbom: true

      - name: Attest provenance
        if: steps.policy.outputs.rebuild == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.policy.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
