name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR title, description and branch
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR model
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::A descrição do PR é obrigatória."
            exit 1
          fi

          if ! grep -Fq "## Descrição" <<< "$PR_BODY"; then
            echo "::error::A descrição deve conter a seção '## Descrição'."
            exit 1
          fi

          if ! grep -Fq "## Branch" <<< "$PR_BODY"; then
            echo "::error::A descrição deve conter a seção '## Branch'."
            exit 1
          fi

          if [[ "$BASE_REF" == "develop" ]]; then
            if [[ ! "$HEAD_REF" =~ ^(feature|fix|refactor|chore|docs|test|ci|perf)/[a-z0-9][a-z0-9._/-]*$ ]]; then
              echo "::error::PR para develop deve vir de feature/*, fix/*, refactor/*, chore/*, docs/*, test/*, ci/* ou perf/*."
              exit 1
            fi

            if [[ ! "$PR_TITLE" =~ ^(feat|fix|perf|refactor|chore|docs|test|ci|build)(\([a-zA-Z0-9._/-]+\))?(!)?:\ .+ ]]; then
              echo "::error::Título inválido. Exemplo: feat(auth): adicionar login ou fix(api): corrigir timeout"
              exit 1
            fi
          elif [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "develop" ]]; then
              echo "::error::A branch main aceita release somente a partir de develop."
              exit 1
            fi

            if [[ ! "$PR_TITLE" =~ ^release\((patch|minor|major)\):\ .+ ]]; then
              echo "::error::PR develop -> main deve usar release(patch|minor|major): descrição"
              exit 1
            fi
          fi

  backend-static:
    name: Backend syntax and indentation
    if: github.event.pull_request.draft == false
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app alembic tests

      - name: Check Python indentation
        run: python -m tabnanny app alembic tests

      - name: Validate Vercel Python dependency manifest
        shell: bash
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          def package_name(spec: str) -> str:
              return re.split(r"[<>=!~\[\s]", spec.strip(), maxsplit=1)[0].lower().replace("_", "-")

          requirements = [
              line.strip()
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          runtime_requirements = [
              spec for spec in requirements
              if package_name(spec) not in {"pytest", "pytest-asyncio"}
          ]

          with Path("pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle).get("project", {})

          declared = {
              package_name(spec)
              for spec in project.get("dependencies", [])
          }
          required = {package_name(spec) for spec in runtime_requirements}
          missing = sorted(required - declared)

          if missing:
              raise SystemExit(
                  "pyproject.toml is missing Vercel runtime dependencies: "
                  + ", ".join(missing)
              )

          if "fastapi" not in declared:
              raise SystemExit("pyproject.toml must declare fastapi for the Vercel runtime.")

          print("Vercel Python runtime dependency manifest is complete.")
          PY

      - name: Enforce zero-upload fiscal processing on release PRs
        if: github.base_ref == 'main'
        shell: bash
        run: |
          set -Eeuo pipefail
          violations=0

          if [[ -e frontend/src/api/multipart.ts ]]; then
            echo "::error::Release blocked: legacy fiscal multipart helper still exists."
            violations=1
          fi

          if grep -RIn --include='*.ts' --include='*.tsx' \
            -E 'createFiscalInputFormData|new FormData\(' \
            frontend/src/api/solicitacoes.ts frontend/src/pages/NovaSolicitacao frontend/src/lib/localProcessing; then
            echo "::error::Release blocked: fiscal processing still contains multipart/FormData upload code."
            violations=1
          fi

          if grep -RIn --include='*.py' \
            -E 'UploadFile|File\(|Form\(' app/api/endpoints/solicitacoes.py app/api/endpoints/processamento_local.py; then
            echo "::error::Release blocked: fiscal API still exposes file/form upload contracts."
            violations=1
          fi

          if grep -RIn --include='*.ts' --include='*.tsx' \
            -E '/pre-analisar|/processar|/solicitacoes/.*/download' \
            frontend/src/api/solicitacoes.ts frontend/src/pages/NovaSolicitacao; then
            echo "::error::Release blocked: frontend still references legacy server-side fiscal processing."
            violations=1
          fi

          if (( violations != 0 )); then
            echo "Fiscal processing must be browser-local and zero-upload before develop can be released to main."
            exit 1
          fi

      - name: Validate root Vercel fullstack config
        run: |
          python -c "import json; cfg=json.load(open('vercel.json', encoding='utf-8')); assert set(cfg['services']) == {'frontend','backend'}; assert cfg['services']['backend']['entrypoint'] == 'app.main:app'; assert cfg['services']['frontend']['rewrites'] == [{'source': '/(.*)', 'destination': '/index.html'}]"
          python -c "import tomllib; cfg=tomllib.load(open('pyproject.toml','rb')); assert cfg['tool']['vercel']['entrypoint'] == 'app.main:app'"

  frontend-static:
    name: Frontend lint and typecheck - no build
    if: github.event.pull_request.draft == false
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend regression tests
        working-directory: frontend
        run: npm run test

      - name: TypeScript typecheck without emit
        working-directory: frontend
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false
          npx tsc --noEmit -p tsconfig.node.json --pretty false

      - name: PWA and Vercel static validation - no build
        run: |
          node --check frontend/public/sw.js
          node --check frontend/public/runtime-config.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/public/manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json','utf8'))"
