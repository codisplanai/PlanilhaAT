name: ${COMPOSE_PROJECT_NAME:-planaut}

x-app: &app
  image: ${PLANAUT_IMAGE:-ghcr.io/codisplanai/planilhaat:production}
  env_file:
    - .env
  restart: unless-stopped
  init: true
  networks:
    - planaut
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  app:
    <<: *app
    container_name: ${APP_CONTAINER_NAME:-planaut-app}
    read_only: true
    ports:
      - "${PLANAUT_BIND_ADDRESS:-127.0.0.1}:${PLANAUT_PORT:-8000}:8000"
    volumes:
      - templates:/app/storage/templates
      - outputs:/app/storage/outputs
      - uploads:/app/storage/uploads
    tmpfs:
      - /tmp:size=128m,mode=1777

  migrate:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    read_only: true
    command: ["alembic", "upgrade", "head"]
    tmpfs:
      - /tmp:size=64m,mode=1777

  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/codisplanai/planilhaat-postgres:16-alpine}
    profiles: ["local-db"]
    container_name: ${POSTGRES_CONTAINER_NAME:-planaut-postgres}
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - planaut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planaut} -d ${POSTGRES_DB:-planaut}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  planaut:
    driver: bridge

volumes:
  templates:
  outputs:
  uploads:
  postgres:
